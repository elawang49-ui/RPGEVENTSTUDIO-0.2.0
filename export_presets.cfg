ssh_remote_deploy/cleanup_script="if (Test-Path '{temp_dir}\\{archive_name}') { Remove-Item -LiteralPath '{temp_dir}\\{archive_name}' -Recurse -Force }; if (Test-Path '{temp_dir}\\{archive_name}_temp') { Stop-Process -Name '{exe_name}' -Force -ErrorAction SilentlyContinue; Remove-Item -LiteralPath '{temp_dir}\\{archive_name}_temp' -Recurse -Force }"
